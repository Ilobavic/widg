<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Morning Brief</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: #f5f6ff; background: #090b18; }
      main { width: min(100%, 680px); margin: 0 auto; padding: 32px 20px 48px; }
      .orb { position: fixed; width: 300px; height: 300px; border-radius: 50%; filter: blur(70px); opacity: .26; pointer-events: none; }
      .one { background: #7c5cff; top: -160px; left: -110px; } .two { background: #008cff; right: -130px; top: 190px; }
      .eyebrow { color: #aeb6ff; letter-spacing: .14em; font-size: .72rem; font-weight: 800; text-transform: uppercase; }
      h1 { margin: 8px 0 4px; font-size: clamp(2rem, 10vw, 3.25rem); letter-spacing: -.07em; line-height: 1; }
      #updated { margin: 0 0 26px; color: #9ca3bd; font-size: .93rem; }
      .card { position: relative; margin: 12px 0; padding: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,.1); border-radius: 20px; background: rgba(22,25,47,.76); box-shadow: 0 18px 50px rgba(0,0,0,.2); backdrop-filter: blur(18px); }
      .card::before { content:""; position:absolute; inset: 0 auto 0 0; width: 4px; background: var(--accent, #7c5cff); }
      .label { display:flex; align-items:center; gap: 8px; color:#b8bfd6; font-size:.78rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; }
      .dot { width:8px; height:8px; border-radius:50%; background:var(--accent,#7c5cff); box-shadow: 0 0 15px var(--accent,#7c5cff); }
      h2 { margin: 10px 0 7px; font-size: 1.08rem; letter-spacing: -.02em; }
      p { margin: 0; color:#d2d6ea; font-size:.97rem; line-height:1.55; }
      .action { margin-top:12px; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.06); color:#f0f1ff; font-size:.9rem; }
      .urgency { float:right; color:var(--accent,#7c5cff); }
      a { color:#bec6ff; }
      .empty { color:#bfc6dc; text-align:center; padding:36px 20px; }
      footer { margin-top:28px; color:#777f9f; font-size:.75rem; text-align:center; }
    </style>
  </head>
  <body>
    <div class="orb one"></div><div class="orb two"></div>
    <main>
      <div class="eyebrow">Your daily signal</div>
      <h1>Morning Brief</h1>
      <p id="updated">Loading latest update…</p>
      <section id="items"></section>
      <footer>Powered by your Slack priorities</footer>
    </main>
    <script>
      const colors = { high: '#ff6b7a', medium: '#ffbf5b', low: '#6cdbbb' };
      const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
      fetch('./brief.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject()).then(brief => {
        document.querySelector('#updated').textContent = brief.updated ? `Updated ${brief.updated}` : 'Latest Slack priorities';
        const items = brief.items || [];
        document.querySelector('#items').innerHTML = items.length ? items.map(item => {
          const urgency = String(item.urgency || 'medium').toLowerCase(); const color = colors[urgency] || colors.medium;
          return `<article class="card" style="--accent:${color}"><div class="label"><span class="dot"></span>${esc(item.source || 'Slack')}<span class="urgency">${esc(urgency)}</span></div><h2>${esc(item.title)}</h2><p>${esc(item.why)}</p><div class="action"><strong>Next:</strong> ${esc(item.action)}${item.link ? ` <a href="${esc(item.link)}" target="_blank" rel="noopener">Open ↗</a>` : ''}</div></article>`;
        }).join('') : '<div class="card empty">No urgent items found.</div>';
      }).catch(() => { document.querySelector('#updated').textContent = 'Brief unavailable'; document.querySelector('#items').innerHTML = '<div class="card empty">The latest brief is not available yet.</div>'; });
    </script>
  </body>
</html>
